name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy "pytest>=8.0.0" "pytest-asyncio>=0.24.0" pytest-cov pytest-mock pytest-timeout
          pip install requests cachetools vaderSentiment ccxt websockets
          pip install pydantic pydantic-settings python-dotenv pyyaml loguru httpx aiohttp
          pip install fastapi uvicorn sqlalchemy aiosqlite python-multipart
          pip install cryptography python-jose[cryptography] schedule
          pip install types-requests types-cachetools pandas

      - name: Lint with flake8
        run: |
          flake8 bot/ tests/ scripts/

      - name: Type check with mypy (optional)
        run: |
          mypy bot/sentiment/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --follow-imports=silent
        continue-on-error: true

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \ 
            --cov=bot \ 
            --cov=tv_gateway \ 
            --cov-report=term-missing \ 
            --cov-report=xml \ 
            -v \ 
            --timeout=60
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  dashboard-build:
    name: Dashboard Build (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
