# ETH Scalping Strategy Configuration

strategy:
  name: "eth_scalp"
  description: "ETH/USDT scalping tuned for medium volatility trend continuation"
  class_name: "ETHScalpStrategy"
  
timeframes:
  primary: "5m"
  regime_htf: "15m"
  
regime_filter:
  ema_fast: 50
  ema_slow: 200
  adx_threshold: 22  # Slightly lower threshold for ETH
  adx_period: 14
  require_trending_regime: true
  
entry_signals:
  ema_period: 21
  rsi_period: 14
  rsi_long_threshold: 42  # Slightly higher for ETH's volatility
  rsi_short_threshold: 58
  require_price_rejection: true
  momentum_confirmation: true  # Additional momentum filter for ETH
  
filters:
  atr_period: 14
  atr_min_threshold: 0.001  # ETH typically has higher volatility than BTC
  volume_period: 20
  volume_multiplier: 1.3  # Require stronger volume confirmation
  
risk_parameters:
  stop_loss_atr_multiplier: 2.2  # Slightly wider stops for ETH volatility
  take_profit_r_multiples: [1.5, 2.5, 4.0]
  breakeven_at_atr: 1.5
  trailing_stop_enabled: false
  
# TODO: calibrate via hyperopt/backtest
optimization_targets:
  primary_metric: "sharpe_ratio"
  min_trades: 100
  max_drawdown_tolerance: 0.15
