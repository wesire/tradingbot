services:
  # Trading bot service
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc_scalper_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot/data:/app/bot/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./user_data:/app/user_data
    environment:
      - TRADING_MODE=${TRADING_MODE:-dry_run}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-binance}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: >
      python -m freqtrade trade
      --config bot/config/freqtrade_config.json
      --strategy BTCScalpStrategy
      --datadir bot/data
    networks:
      - trading_network
    depends_on:
      - webhook

  # TradingView webhook gateway
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: btc_scalper_webhook
    restart: unless-stopped
    ports:
      - "${TV_WEBHOOK_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    environment:
      - TV_WEBHOOK_SECRET=${TV_WEBHOOK_SECRET}
      - TV_WEBHOOK_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Phase 2: Alert execution configuration
      - ALERT_MAX_AGE_SECONDS=${ALERT_MAX_AGE_SECONDS:-600}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-0.9}
      - ALLOWED_SYMBOLS=${ALLOWED_SYMBOLS:-BTC/USDT:USDT}
      - ALLOWED_TIMEFRAMES=${ALLOWED_TIMEFRAMES:-5m}
      - EXECUTION_ENABLED=${EXECUTION_ENABLED:-true}
      # Exchange credentials
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-binance}
      - EXCHANGE_SANDBOX=${EXCHANGE_SANDBOX:-true}
      # Trading mode
      - TRADING_MODE=${TRADING_MODE:-dry_run}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - RUNMODE=${RUNMODE:-dry-run}
      - CONFIRM_LIVE_TRADING=${CONFIRM_LIVE_TRADING}
      # AI Advisor
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_ADVISOR_ENABLED=${AI_ADVISOR_ENABLED:-true}
      # Sentiment providers
      - CRYPTOPANIC_API_KEY=${CRYPTOPANIC_API_KEY}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-TradingBot/1.0 Sentiment Scraper}
      - FEAR_GREED_CACHE_TTL_SECONDS=${FEAR_GREED_CACHE_TTL_SECONDS:-3600}
      - SENTIMENT_LOOKBACK_HOURS=${SENTIMENT_LOOKBACK_HOURS:-24}
      - SENTIMENT_UPDATE_INTERVAL_MINUTES=${SENTIMENT_UPDATE_INTERVAL_MINUTES:-60}
      # Multi-pair settings
      - ENABLED_PAIRS=${ENABLED_PAIRS:-BTC/USDT:USDT,ETH/USDT:USDT}
      # ML model
      - ML_MODEL_PATH=${ML_MODEL_PATH}
      # Bot integration
      - BOT_TYPE=${BOT_TYPE:-freqtrade}
      - FREQTRADE_API_URL=${FREQTRADE_API_URL:-http://bot:8080}
      - FREQTRADE_API_USERNAME=${FREQTRADE_API_USERNAME}
      - FREQTRADE_API_PASSWORD=${FREQTRADE_API_PASSWORD}
    command: >
      python -m uvicorn tv_gateway.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading_network

  # Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: btc_scalper_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading_network
    depends_on:
      - webhook

networks:
  trading_network:
    driver: bridge

volumes:
  bot_data:
  artifacts:
  logs:
